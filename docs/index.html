<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b14">
<title>УБСТ2503 · Учёба</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<section id="lock" class="lock">
  <form id="lockForm" class="lock-card glass">
    <div class="lock-emoji">🎓</div>
    <h1>УБСТ2503</h1>
    <p class="muted">Расписание, дедлайны и всё важное из чата. Введите пароль группы.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" required>
    <label class="check"><input id="remember" type="checkbox" checked> Запомнить на этом устройстве</label>
    <button class="btn primary" type="submit">Открыть</button>
    <p id="lockErr" class="err" hidden></p>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><span class="logo">🎓</span><div><b id="grp">УБСТ2503</b><small id="fresh" class="muted"></small></div></div>
    <nav id="tabs" class="tabs">
      <button data-tab="home" class="on">Главная</button>
      <button data-tab="cal">Календарь</button>
      <button data-tab="dl">Дедлайны <span id="dlCount" class="badge"></span></button>
      <button data-tab="subj">Предметы</button>
      <button data-tab="chat">Чат</button>
    </nav>
    <div class="top-actions">
      <button id="icsBtn" class="btn ghost" title="Скачать .ics для Google/Apple календаря">📅 .ics</button>
      <button id="themeBtn" class="btn ghost" title="Тема">🌓</button>
      <button id="logoutBtn" class="btn ghost" title="Выйти">⎋</button>
    </div>
  </header>

  <main>
    <section id="tab-home" class="tab on"></section>
    <section id="tab-cal" class="tab"></section>
    <section id="tab-dl" class="tab"></section>
    <section id="tab-subj" class="tab"></section>
    <section id="tab-chat" class="tab"></section>
  </main>
  <nav id="bottomTabs" class="bottom-tabs"></nav>
</div>

<div id="drawer" class="drawer" hidden><div class="drawer-bg" data-close></div><div class="drawer-panel glass"><button class="x" data-close>✕</button><div id="drawerBody"></div></div></div>

<script src="app.js"></script>
</body>
</html>
